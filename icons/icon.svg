<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="#052e16"/>
  <rect x="24" y="24" width="464" height="464" rx="92" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- SahajSetu Bridge / Network Graphic Symbol -->
  <g transform="translate(96, 96)" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center Node (Parent) -->
    <circle cx="160" cy="80" r="34" fill="#ffffff" stroke="none"/>
    
    <!-- Left Node (Local Shop AI) -->
    <circle cx="50" cy="240" r="28" fill="#ffffff" stroke="none"/>
    
    <!-- Right Node (FarmLink) -->
    <circle cx="270" cy="240" r="28" fill="#ffffff" stroke="none"/>

    <!-- Bottom Center Node (FoodShare) -->
    <circle cx="160" cy="270" r="24" fill="#ffffff" stroke="none"/>

    <!-- Connection Arches / Setu (Bridge) -->
    <path d="M 50 240 Q 160 170 270 240" />
    <path d="M 50 240 L 160 80" />
    <path d="M 270 240 L 160 80" />
    <path d="M 160 80 L 160 270" stroke-dasharray="16 12"/>
  </g>

  <!-- Brand Subtext -->
  <text x="256" y="440" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">SAHAJSETU</text>
</svg>
